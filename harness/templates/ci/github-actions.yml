# TEMPLATE ONLY - not enabled. Nothing in this repository runs until the repo is
# placed under Git and this file is copied to <repo>/.github/workflows/.
# The gates that DO run are the local ones: .\harness\tools\verify.ps1 (see AGENTS.md §2).
# Every job here must be able to FAIL: no `|| true`, no continue-on-error.
name: f280039c-harness-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build host tests
        run: |
          cmake -S harness/tests/host -B harness/tests/host/build-ci
          cmake --build harness/tests/host/build-ci
      - name: Run unit tests
        run: ctest --test-dir harness/tests/host/build-ci --output-on-failure

  static-analysis:
    name: cppcheck static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyze project sources
        run: |
          cppcheck --enable=warning,style --std=c11 --xml --xml-version=2 \
            --suppress=missingInclude --error-exitcode=1 \
            projects/launchxl-f280039c-led-chaser/source 2> cppcheck.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.xml

  spec-check:
    name: Spec contracts (structure + traceability)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate specs
        shell: pwsh
        run: .\harness\tools\spec.ps1 check

  firmware-build:
    name: Firmware build (C2000 cl2000)
    runs-on: windows-latest
    if: ${{ vars.RUN_FW_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CCS + C2000Ware
        shell: pwsh
        run: |
          # 安装 CCS / C2000Ware 后，设置环境变量（Secrets/Variables 管理）
          #   CCS_ROOT, C2000WARE_ROOT
          Write-Host "Requires: Code Composer Studio 21.x with ti-cgt-c2000 (>= 22.6.3.LTS)"
      - name: Environment self-check
        shell: pwsh
        run: .\harness\tools\doctor.ps1
      - name: Build CPU1_FLASH
        shell: pwsh
        run: .\harness\tools\ccs.ps1 build -Project projects\launchxl-f280039c-led-chaser -Config CPU1_FLASH
      - name: Build CPU1_RAM
        shell: pwsh
        run: .\harness\tools\ccs.ps1 build -Project projects\launchxl-f280039c-led-chaser -Config CPU1_RAM
      - name: Size report
        shell: pwsh
        run: .\harness\tools\ccs.ps1 size -Project projects\launchxl-f280039c-led-chaser
